<!doctype html>
<!--
  The technical record: every claim, every verdict with its locators, the
  parameters with what lost, the evidence, the gaps and the decisions. It stays
  at the site's root, beside the redirect in index.html; its back link goes to
  the engineering page. A shell, like engineering/index.html: `nopekit site init` writes it once, `nopekit site build`
  writes it only when it is absent, and neither replaces it after that. Edit it
  freely. app.js and the files in lib/ are the renderer and `site build`
  refreshes them; keep your edits here, or rename what you fork.

  Nothing on this page is a source of truth. It reads site/data/state.json,
  which `nopekit site build` writes from the records and the verdict cache. If
  a number is wrong, a record or the cache is wrong.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Technical record</title>
    <link rel="stylesheet" href="style.css" />

    <script>
      // THE IMPORT MAP, chosen at load time: a vendored three.js when
      // `nopekit site vendor` has been run, the CDN otherwise. Both spellings
      // map the bare specifiers `three` and `three/addons/`, so every addon's
      // internal `import ... from 'three'` resolves either way.
      //
      // The probe is a SYNCHRONOUS XHR, which is deprecated and deliberate: an
      // import map has to be in the document before the first module begins
      // loading, so the choice cannot be awaited. The vendor layout MIRRORS the
      // package's own (jsm/loaders/..., jsm/utils/...), because GLTFLoader.js
      // imports '../utils/BufferGeometryUtils.js' relatively.
      (function () {
        var CDN = "https://cdn.jsdelivr.net/npm/three@0.169.0/";
        var vendored = false;
        try {
          var probe = new XMLHttpRequest();
          probe.open("HEAD", "vendor/three.module.js", false);
          probe.send(null);
          vendored = probe.status >= 200 && probe.status < 400;
        } catch (err) {
          vendored = false;
        }
        var imports = vendored
          ? { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" }
          : { "three": CDN + "build/three.module.js", "three/addons/": CDN + "examples/jsm/" };
        var tag = document.createElement("script");
        tag.type = "importmap";
        tag.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(tag);
        document.documentElement.dataset.three = vendored ? "vendor" : "cdn";
      })();
    </script>
  </head>

  <body>
    <p class="back-link"><a href="engineering/">Back to the engineering page</a></p>
    <div id="app">
      <p class="booting">Reading the data.</p>
    </div>

    <!-- Made with nopekit: the last section of every nopekit site. The badge
         ships with the template (img/made-with-nopekit.png); keep it. -->
    <section class="panel made-with" id="made-with-nopekit">
      <a href="https://github.com/neuman/nopekit"><img src="img/made-with-nopekit.png" width="200" height="200" loading="lazy" alt="Made with nopekit: a honey badger with goggles, a tool belt and a red toolbox"></a>
      <div>
        <h2>Made with nopekit</h2>
        <p>nopekit is the check tool for this design. It runs the checks, records the evidence and builds this site.</p>
        <p><a href="https://github.com/neuman/nopekit">github.com/neuman/nopekit</a></p>
      </div>
    </section>

    <noscript>
      <div class="no-state">
        <h1>This page needs JavaScript to show the record.</h1>
        <p>
          Each value it shows is in <code class="mono">data/state.json</code>. That file is
          plain JSON. You can read it without a browser:
        </p>
        <pre class="cmd"><code class="mono">curl -s http://localhost:8000/data/state.json | python3 -m json.tool</code></pre>
        <p class="small muted">
          That file is the whole page. An agent can read a verdict there without a browser.
        </p>
      </div>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
